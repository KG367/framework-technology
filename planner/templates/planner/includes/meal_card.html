<li class="list-group-item meal-card d-flex justify-content-between align-items-center">
    <div>
        <strong>{{ meal.date|default:"Дата не указана" }}</strong>
        <span class="badge bg-info text-dark ms-2">{{ meal.slot }}</span>
        <span class="ms-2">{{ meal.dish.name }}</span>
        <span class="text-muted ms-1">(x{{ meal.portions }})</span>
    </div>
    <a href="{% url 'planner:detail' meal.meal_id %}" class="btn btn-sm btn-outline-primary">
        Подробнее
    </a>
</li>
